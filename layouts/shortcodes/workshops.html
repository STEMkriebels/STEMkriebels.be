{{ $workshops := where site.RegularPages "Section" "workshops" }}
{{ $workshops = sort $workshops "Weight" }}

<div class="workshop-grid">
  {{ range $workshops }}
    <a href="{{ .RelPermalink }}" class="workshop-card">

      {{ with .Params.image }}
        <img src="{{ . | relURL }}" alt="{{ $.Page.Title }}">
      {{ end }}

      <div class="workshop-card-content">
        <h2>{{ .Title }}</h2>
        <p>{{ .Description }}</p>
      </div>

    </a>
  {{ end }}
</div>
